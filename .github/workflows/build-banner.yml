name: Build AyuGram 7.0.9 with Profile Banner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout your fork (only to get the patch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          path: control

      - name: Save profile banner patch
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\control\profile-banner.patch" "$env:RUNNER_TEMP\profile-banner.patch"

      # This is the exact commit contained in the AyuGramDesktop-7.0.9.zip
      # that the profile-banner patch was created and verified against.
      - name: Checkout exact AyuGram 7.0.9 source
        uses: actions/checkout@v4
        with:
          repository: AyuGram/AyuGramDesktop
          ref: 032ad328549cff9f612d106d8660fbc03eb43130
          fetch-depth: 1
          submodules: recursive
          path: src

      - name: Apply profile banner patch
        shell: pwsh
        working-directory: src
        run: |
          git apply --check "$env:RUNNER_TEMP\profile-banner.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply "$env:RUNNER_TEMP\profile-banner.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Work around current MSYS2 diffutils package rename
        shell: pwsh
        working-directory: src
        run: |
          $file = "Telegram/build/prepare/prepare.py"
          $path = Resolve-Path $file
          $text = [System.IO.File]::ReadAllText($path)
          $old = "mingw-w64-x86_64-diffutils ^"
          if (-not $text.Contains($old)) {
            throw "Expected mingw-w64-x86_64-diffutils dependency was not found in prepare.py"
          }
          $text = $text.Replace($old, "diffutils ^")
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

      - name: Prepare dependencies
        shell: cmd
        working-directory: src
        run: Telegram\build\prepare\win.bat

      - name: Configure
        shell: cmd
        working-directory: src\Telegram
        run: configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build Release
        shell: cmd
        working-directory: src
        run: cmake --build out --config Release --target Telegram --parallel

      - name: Show produced files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\src\out\Release") {
            Get-ChildItem "$env:GITHUB_WORKSPACE\src\out\Release" | Format-Table Name, Length
          }

      - name: Upload AyuGram
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-7.0.9-ProfileBanner-Windows
          path: src/out/Release/AyuGram.exe
          if-no-files-found: error
